# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: TrialScout - plain-language paper summaries

# 1. PROMPTS: the versions we are comparing. {{title}} and {{abstract}} come from each test case.
prompts:
  # v1 and v2 are earlier baselines. Uncomment to bring them back.
  # - file://prompts/v1_basic.txt
  # - file://prompts/v2_strict.txt
  - file://prompts/v3_explain_terms.txt
  - file://prompts/v4_final.txt
  - file://prompts/v5_example.txt

# 2. PROVIDERS: the model(s) that run each prompt. Needs ANTHROPIC_API_KEY.
providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    label: haiku-4.5
    config:
      max_tokens: 300
      temperature: 0
  # Step 4 of the learning plan: uncomment to add a second model to the grid.
  # - id: anthropic:messages:claude-sonnet-4-6
  #   label: sonnet-4.6
  #   config:
  #     max_tokens: 300
  #     temperature: 0

# 3. TESTS: 9 real PubMed abstracts + 1 edge case, generated by make_tests.py.
tests: file://tests.yaml

# 4. ASSERTIONS: checks applied to every test case.
defaultTest:
  options:
    # The model that grades the llm-rubric checks (kept separate from the model being tested).
    # Temperature 0 makes the grader as repeatable as possible; the same text was scored very differently across runs before.
    provider:
      id: anthropic:messages:claude-sonnet-4-6
      config:
        temperature: 0
  assert:
    # Cheap deterministic checks first.
    # The prompts promise a short answer, so check words, not characters (60 = 50-word target plus margin).
    - type: javascript
      value: output.trim().split(/\s+/).length <= 60
      metric: short-enough

    # JavaScript regexes have no inline (?i) flag, so the case-insensitive flag goes on a regex literal.
    - type: javascript
      value: "!/\\b(breakthroughs?|cure[sd]?|miracles?|revolutionary|revolutionize[sd]?|game-changing)\\b/i.test(output)"
      metric: no-hype

    # The app shows raw text, so a markdown heading like "# Summary" would look broken.
    - type: javascript
      value: "!/^\\s*#{1,6}\\s/m.test(output)"
      metric: no-markdown-header

    # Hallucination guard: every number in the summary must appear in the abstract,
    # either exactly or rounded to a whole number (42.9% -> 43% is fine).
    - type: javascript
      value: |
        const text = output.replace(/\b\d+[- ]sentences?\b/gi, '');
        const nums = (text.match(/\d+(?:\.\d+)?/g) || []).map(Number);
        const absNums = (context.vars.abstract.match(/\d+(?:\.\d+)?/g) || []).map(Number);
        return nums.every(n => absNums.some(a => a === n || Math.round(a) === n));
      metric: no-invented-numbers

    # LLM-graded checks last (slower and costlier, but they catch what rules cannot).
    # Scores need a threshold, otherwise pass/fail is just the grader's own yes/no.
    - type: llm-rubric
      threshold: 0.8
      value: >-
        Check the summary against this abstract:
        {{abstract}}
        Score 1.0 if every claim in the summary is stated in the abstract or follows
        directly from it. Score about 0.7 if one claim is a small generalization the
        abstract does not quite state. Score below 0.5 if the summary adds a finding,
        an outcome, a treated condition, or a safety claim that the abstract does not
        state, or if it contradicts the abstract.
      metric: faithful

    - type: llm-rubric
      threshold: 0.7
      value: >-
        The reader is a curious adult who reads health news but has no medical training.
        Score 1.0 if that reader would follow the whole summary. The main drug, gene,
        therapy, or disease named in the paper's title may be used if the summary shows
        what kind of thing it is (for example "a drug", "a gene", "a cell therapy").
        Everyday words are fine (cancer, immune system, kidney, diabetes, insulin,
        remission, side effects, clinical trial). Score about 0.7 if one minor term
        is unclear. Score below 0.5 if several technical terms are unexplained:
        mutation codes, unexplained acronyms, or cell, protein, or drug-class names.
      metric: plain-language
