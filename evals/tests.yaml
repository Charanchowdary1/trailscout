- description: KRAS inhibitors in lung cancer | PMID 34161704
  vars:
    title: Acquired Resistance to KRASG12C Inhibition in Cancer.
    abstract: 'BACKGROUND: Clinical trials of the KRAS inhibitors adagrasib and sotorasib have shown promising
      activity in cancers harboring KRAS glycine-to-cysteine amino acid substitutions at codon 12 (KRASG12C).
      The mechanisms of acquired resistance to these therapies are currently unknown.

      METHODS: Among patients with KRASG12C -mutant cancers treated with adagrasib monotherapy, we performed
      genomic and histologic analyses that compared pretreatment samples with those obtained after the
      development of resistance. Cell-based experiments were conducted to study mutations that confer
      resistance to KRASG12C inhibitors.

      RESULTS: A total of 38 patients were included in this study: 27 with non-small-cell lung cancer,
      10 with colorectal cancer, and 1 with appendiceal cancer. Putative mechanisms of resistance to adagrasib
      were detected in 17 patients (45% of the cohort), of whom 7 (18% of the cohort) had multiple coincident
      mechanisms. Acquired KRAS alterations included G12D/R/V/W, G13D, Q61H, R68S, H95D/Q/R, Y96C, and
      high-level amplification of the KRASG12C allele. Acquired bypass mechanisms of resistance included
      MET amplification; activating mutations in NRAS, BRAF, MAP2K1, and RET; oncogenic fusions involving
      ALK, RET, BRAF, RAF1, and FGFR3; and loss-of-function mutations in NF1 and PTEN. In two of nine
      patients with lung adenocarcinoma for whom paired tissue-biopsy samples were available, histologic
      transformation to squamous-cell carcinoma was observed without identification of any other resistance
      mechanisms. Using an in vitro deep mutational scanning screen, we systematically defined the landscape
      of KRAS mutations that confer resistance to KRASG12C inhibitors.

      CONCLUSIONS: Diverse genomic and histologic mechanisms impart resistance to covalent KRASG12C inhibitors,
      and new therapeutic strategies are required to delay and overcome this drug resistance in patients
      with cancer. (Funded by Mirati Therapeutics and others; ClinicalTrials.gov number, NCT03785249.).'
- description: KRAS inhibitors in lung cancer | PMID 35658005
  vars:
    title: Adagrasib in Non-Small-Cell Lung Cancer Harboring a KRASG12C Mutation.
    abstract: 'BACKGROUND: Adagrasib, a KRASG12C inhibitor, irreversibly and selectively binds KRASG12C,
      locking it in its inactive state. Adagrasib showed clinical activity and had an acceptable adverse-event
      profile in the phase 1-1b part of the KRYSTAL-1 phase 1-2 study.

      METHODS: In a registrational phase 2 cohort, we evaluated adagrasib (600 mg orally twice daily)
      in patients with KRASG12C -mutated non-small-cell lung cancer (NSCLC) previously treated with platinum-based
      chemotherapy and anti-programmed death 1 or programmed death ligand 1 therapy. The primary end point
      was objective response assessed by blinded independent central review. Secondary end points included
      the duration of response, progression-free survival, overall survival, and safety.

      RESULTS: As of October 15, 2021, a total of 116 patients with KRASG12C -mutated NSCLC had been treated
      (median follow-up, 12.9 months); 98.3% had previously received both chemotherapy and immunotherapy.
      Of 112 patients with measurable disease at baseline, 48 (42.9%) had a confirmed objective response.
      The median duration of response was 8.5 months (95% confidence interval [CI], 6.2 to 13.8), and
      the median progression-free survival was 6.5 months (95% CI, 4.7 to 8.4). As of January 15, 2022
      (median follow-up, 15.6 months), the median overall survival was 12.6 months (95% CI, 9.2 to 19.2).
      Among 33 patients with previously treated, stable central nervous system metastases, the intracranial
      confirmed objective response rate was 33.3% (95% CI, 18.0 to 51.8). Treatment-related adverse events
      occurred in 97.4% of the patients - grade 1 or 2 in 52.6% and grade 3 or higher in 44.8% (including
      two grade 5 events) - and resulted in drug discontinuation in 6.9% of patients.

      CONCLUSIONS: In patients with previously treated KRASG12C -mutated NSCLC, adagrasib showed clinical
      efficacy without new safety signals. (Funded by Mirati Therapeutics; ClinicalTrials.gov number,
      NCT03785249.).'
- description: KRAS inhibitors in lung cancer | PMID 38637634
  vars:
    title: Targeting KRAS in cancer.
    abstract: RAS family variants-most of which involve KRAS-are the most commonly occurring hotspot mutations
      in human cancers and are associated with a poor prognosis. For almost four decades, KRAS has been
      considered undruggable, in part due to its structure, which lacks small-molecule binding sites.
      But recent developments in bioengineering, organic chemistry and related fields have provided the
      infrastructure to make direct KRAS targeting possible. The first successes occurred with allele-specific
      targeting of KRAS p.Gly12Cys (G12C) in non-small cell lung cancer, resulting in regulatory approval
      of two agents-sotorasib and adagrasib. Inhibitors targeting other variants beyond G12C have shown
      preliminary antitumor activity in highly refractory malignancies such as pancreatic cancer. Herein,
      we outline RAS pathobiology with a focus on KRAS, illustrate therapeutic approaches across a variety
      of malignancies, including emphasis on the 'on' and 'off' switch allele-specific and 'pan' RAS inhibitors,
      and review immunotherapeutic and other key combination RAS targeting strategies. We summarize mechanistic
      understanding of de novo and acquired resistance, review combination approaches, emerging technologies
      and drug development paradigms and outline a blueprint for the future of KRAS therapeutics with
      anticipated profound clinical impact.
- description: CAR-T therapy for lupus | PMID 38381673
  vars:
    title: CD19 CAR T-Cell Therapy in Autoimmune Disease - A Case Series with Follow-up.
    abstract: 'BACKGROUND: Treatment for autoimmune diseases such as systemic lupus erythematosus (SLE),
      idiopathic inflammatory myositis, and systemic sclerosis often involves long-term immune suppression.
      Resetting aberrant autoimmunity in these diseases through deep depletion of B cells is a potential
      strategy for achieving sustained drug-free remission.

      METHODS: We evaluated 15 patients with severe SLE (8 patients), idiopathic inflammatory myositis
      (3 patients), or systemic sclerosis (4 patients) who received a single infusion of CD19 chimeric
      antigen receptor (CAR) T cells after preconditioning with fludarabine and cyclophosphamide. Efficacy
      up to 2 years after CAR T-cell infusion was assessed by means of Definition of Remission in SLE
      (DORIS) remission criteria, American College of Rheumatology-European League against Rheumatism
      (ACR-EULAR) major clinical response, and the score on the European Scleroderma Trials and Research
      Group (EUSTAR) activity index (with higher scores indicating greater disease activity), among others.
      Safety variables, including cytokine release syndrome and infections, were recorded.

      RESULTS: The median follow-up was 15 months (range, 4 to 29). The mean (±SD) duration of B-cell
      aplasia was 112±47 days. All the patients with SLE had DORIS remission, all the patients with idiopathic
      inflammatory myositis had an ACR-EULAR major clinical response, and all the patients with systemic
      sclerosis had a decrease in the score on the EUSTAR activity index. Immunosuppressive therapy was
      completely stopped in all the patients. Grade 1 cytokine release syndrome occurred in 10 patients.
      One patient each had grade 2 cytokine release syndrome, grade 1 immune effector cell-associated
      neurotoxicity syndrome, and pneumonia that resulted in hospitalization.

      CONCLUSIONS: In this case series, CD19 CAR T-cell transfer appeared to be feasible, safe, and efficacious
      in three different autoimmune diseases, providing rationale for further controlled clinical trials.
      (Funded by Deutsche Forschungsgemeinschaft and others.).'
- description: CAR-T therapy for lupus | PMID 38777376
  vars:
    title: 'BCMA-CD19 compound CAR T cells for systemic lupus erythematosus: a phase 1 open-label clinical
      trial.'
    abstract: 'OBJECTIVES: This study aims to evaluate the safety and efficacy of BCMA-CD19 compound chimeric
      antigen receptor T cells (cCAR) to dual reset the humoral and B cell immune system in patients with
      systemic lupus erythematosus (SLE) with lupus nephritis (LN).

      METHODS: This is a single-arm open-label multicentre phase 1 study of BCMA and CD19-directed cCAR
      in patients suffering from SLE/LN with autoantibodies produced by B cells and plasma/long-lived
      plasma cells. In this clinical trial, we sequentially assigned biopsy-confirmed (classes III-V)
      LN patients to receive 3×106 cCAR cells/kg postcessation of all SLE medications and conditioning.
      The primary endpoint of safety and toxicity was assessed. Complete immune reset was indicated by
      B cell receptor (BCR) deep sequencing and flow cytometry analysis. Patient 11 (P11) had insufficient
      lymphocyte counts and was underdosed as compassionate use.

      RESULTS: P1 and P2 achieved symptom and medication-free remission (MFR) from SLE and complete remission
      from lymphoma. P3-P13 (excluding P11) received an initial dose of 3×106 cCAR cells /kg and were
      negative for all autoantibodies, including those derived from long-lived plasma cells, 3 months
      post-cCAR and the complement returned to normal levels. These patients achieved symptom and MFR
      with post-cCAR follow-up to 46 months. Complete recovery of B cells was seen in 2-6 months post-cCAR.
      Mean SLE Disease Activity Index 2000 reduced from 10.6 (baseline) to 2.7 (3 months), and renal function
      significantly improved in 10 LN patients ≤90 days post-cCAR. cCAR T therapy was well tolerant with
      mild cytokine-release syndrome.

      CONCLUSIONS: Data suggest that cCAR therapy was safe and effective in inducing MFR and depleting
      disease-causing autoantibodies in patients with SLE.'
- description: CAR-T therapy for lupus | PMID 36109639
  vars:
    title: Anti-CD19 CAR T cell therapy for refractory systemic lupus erythematosus.
    abstract: 'Systemic lupus erythematosus (SLE) is a life-threatening autoimmune disease characterized
      by adaptive immune system activation, formation of double-stranded DNA autoantibodies and organ
      inflammation. Five patients with SLE (four women and one man) with a median (range) age of 22 (6)
      years, median (range) disease duration of 4 (8) years and active disease (median (range) SLE disease
      activity index Systemic Lupus Erythematosus Disease Activity Index: 16 (8)) refractory to several
      immunosuppressive drug treatments were enrolled in a compassionate-use chimeric antigen receptor
      (CAR) T cell program. Autologous T cells from patients with SLE were transduced with a lentiviral
      anti-CD19 CAR vector, expanded and reinfused at a dose of 1 × 106 CAR T cells per kg body weight
      into the patients after lymphodepletion with fludarabine and cyclophosphamide. CAR T cells expanded
      in vivo, led to deep depletion of B cells, improvement of clinical symptoms and normalization of
      laboratory parameters including seroconversion of anti-double-stranded DNA antibodies. Remission
      of SLE according to DORIS criteria was achieved in all five patients after 3 months and the median
      (range) Systemic Lupus Erythematosus Disease Activity Index score after 3 months was 0 (2). Drug-free
      remission was maintained during longer follow-up (median (range) of 8 (12) months after CAR T cell
      administration) and even after the reappearance of B cells, which was observed after a mean (±s.d.)
      of 110 ± 32 d after CAR T cell treatment. Reappearing B cells were naïve and showed non-class-switched
      B cell receptors. CAR T cell treatment was well tolerated with only mild cytokine-release syndrome.
      These data suggest that CD19 CAR T cell transfer is feasible, tolerable and highly effective in
      SLE.'
- description: GLP-1 agonists and cardiovascular outcomes | PMID 33068776
  vars:
    title: GLP-1 receptor agonists in the treatment of type 2 diabetes - state-of-the-art.
    abstract: 'BACKGROUND: GLP-1 receptor agonists (GLP-1 RAs) with exenatide b.i.d. first approved to
      treat type 2 diabetes in 2005 have been further developed to yield effective compounds/preparations
      that have overcome the original problem of rapid elimination (short half-life), initially necessitating
      short intervals between injections (twice daily for exenatide b.i.d.).

      SCOPE OF REVIEW: To summarize current knowledge about GLP-1 receptor agonist.

      MAJOR CONCLUSIONS: At present, GLP-1 RAs are injected twice daily (exenatide b.i.d.), once daily
      (lixisenatide and liraglutide), or once weekly (exenatide once weekly, dulaglutide, albiglutide,
      and semaglutide). A daily oral preparation of semaglutide, which has demonstrated clinical effectiveness
      close to the once-weekly subcutaneous preparation, was recently approved. All GLP-1 RAs share common
      mechanisms of action: augmentation of hyperglycemia-induced insulin secretion, suppression of glucagon
      secretion at hyper- or euglycemia, deceleration of gastric emptying preventing large post-meal glycemic
      increments, and a reduction in calorie intake and body weight. Short-acting agents (exenatide b.i.d.,
      lixisenatide) have reduced effectiveness on overnight and fasting plasma glucose, but maintain their
      effect on gastric emptying during long-term treatment. Long-acting GLP-1 RAs (liraglutide, once-weekly
      exenatide, dulaglutide, albiglutide, and semaglutide) have more profound effects on overnight and
      fasting plasma glucose and HbA1c, both on a background of oral glucose-lowering agents and in combination
      with basal insulin. Effects on gastric emptying decrease over time (tachyphylaxis). Given a similar,
      if not superior, effectiveness for HbA1c reduction with additional weight reduction and no intrinsic
      risk of hypoglycemic episodes, GLP-1RAs are recommended as the preferred first injectable glucose-lowering
      therapy for type 2 diabetes, even before insulin treatment. However, GLP-1 RAs can be combined with
      (basal) insulin in either free- or fixed-dose preparations. More recently developed agents, in particular
      semaglutide, are characterized by greater efficacy with respect to lowering plasma glucose as well
      as body weight. Since 2016, several cardiovascular (CV) outcome studies have shown that GLP-1 RAs
      can effectively prevent CV events such as acute myocardial infarction or stroke and associated mortality.
      Therefore, guidelines particularly recommend treatment with GLP-1 RAs in patients with pre-existing
      atherosclerotic vascular disease (for example, previous CV events). The evidence of similar effects
      in lower-risk subjects is not quite as strong. Since sodium/glucose cotransporter-2 (SGLT-2) inhibitor
      treatment reduces CV events as well (with the effect mainly driven by a reduction in heart failure
      complications), the individual risk of ischemic or heart failure complications should guide the
      choice of treatment. GLP-1 RAs may also help prevent renal complications of type 2 diabetes. Other
      active research areas in the field of GLP-1 RAs are the definition of subgroups within the type
      2 diabetes population who particularly benefit from treatment with GLP-1 RAs. These include pharmacogenomic
      approaches and the characterization of non-responders. Novel indications for GLP-1 RAs outside type
      2 diabetes, such as type 1 diabetes, neurodegenerative diseases, and psoriasis, are being explored.
      Thus, within 15 years of their initial introduction, GLP-1 RAs have become a well-established class
      of glucose-lowering agents that has the potential for further development and growing impact for
      treating type 2 diabetes and potentially other diseases.'
- description: GLP-1 agonists and cardiovascular outcomes | PMID 37952217
  vars:
    title: Estimated Lifetime Cardiovascular, Kidney, and Mortality Benefits of Combination Treatment
      With SGLT2 Inhibitors, GLP-1 Receptor Agonists, and Nonsteroidal MRA Compared With Conventional
      Care in Patients With Type 2 Diabetes and Albuminuria.
    abstract: 'BACKGROUND: Sodium glucose cotransporter 2 inhibitors (SGLT2i), glucagon-like peptide-1
      receptor agonists (GLP-1 RA), and the nonsteroidal mineralocorticoid receptor antagonist (ns-MRA)
      finerenone all individually reduce cardiovascular, kidney, and mortality outcomes in patients with
      type 2 diabetes and albuminuria. However, the lifetime benefits of combination therapy with these
      medicines are not known.

      METHODS: We used data from 2 SGLT2i trials (CANVAS [Canagliflozin Cardiovascular Assessment] and
      CREDENCE [Canagliflozin and Renal Events in Diabetes with Established Nephropathy Clinical Evaluation]),
      2 ns-MRA trials (FIDELIO-DKD [Finerenone in Reducing Kidney Failure and Disease Progression in Diabetic
      Kidney Disease] and FIGARO-DKD [Efficacy and Safety of Finerenone in Subjects With Type 2 Diabetes
      Mellitus and the Clinical Diagnosis of Diabetic Kidney Disease]), and 8 GLP-1 RA trials to estimate
      the relative effects of combination therapy versus conventional care (renin-angiotensin system blockade
      and traditional risk factor control) on cardiovascular, kidney, and mortality outcomes. Using actuarial
      methods, we then estimated absolute risk reductions with combination SGLT2i, GLP-1 RA, and ns-MRA
      in patients with type 2 diabetes and at least moderately increased albuminuria (urinary albumin:creatinine
      ratio ≥30 mg/g) by applying estimated combination treatment effects to participants receiving conventional
      care in CANVAS and CREDENCE.

      RESULTS: Compared with conventional care, the combination of SGLT2i, GLP-1 RA, and ns-MRA was associated
      with a hazard ratio of 0.65 (95% CI, 0.55-0.76) for major adverse cardiovascular events (nonfatal
      myocardial infarction, nonfatal stroke, or cardiovascular death). The corresponding estimated absolute
      risk reduction over 3 years was 4.4% (95% CI, 3.0-5.7), with a number needed to treat of 23 (95%
      CI, 18-33). For a 50-year-old patient commencing combination therapy, estimated major adverse cardiovascular
      event-free survival was 21.1 years compared with 17.9 years for conventional care (3.2 years gained
      [95% CI, 2.1-4.3]). There were also projected gains in survival free from hospitalized heart failure
      (3.2 years [95% CI, 2.4-4.0]), chronic kidney disease progression (5.5 years [95% CI, 4.0-6.7]),
      cardiovascular death (2.2 years [95% CI, 1.2-3.0]), and all-cause death (2.4 years [95% CI, 1.4-3.4]).
      Attenuated but clinically relevant gains in event-free survival were observed in analyses assuming
      50% additive effects of combination therapy, including for major adverse cardiovascular events (2.4
      years [95% CI, 1.1-3.5]), chronic kidney disease progression (4.5 years [95% CI, 2.8-5.9]), and
      all-cause death (1.8 years [95% CI, 0.7-2.8]).

      CONCLUSIONS: In patients with type 2 diabetes and at least moderately increased albuminuria, combination
      treatment of SGLT2i, GLP-1 RA, and ns-MRA has the potential to afford relevant gains in cardiovascular
      and kidney event-free and overall survival.'
- description: GLP-1 agonists and cardiovascular outcomes | PMID 39114288
  vars:
    title: Mechanisms of action and therapeutic applications of GLP-1 and dual GIP/GLP-1 receptor agonists.
    abstract: Glucose-dependent insulinotropic polypeptide (GIP) and glucagon-like peptide-1 (GLP-1) are
      two incretins that bind to their respective receptors and activate the downstream signaling in various
      tissues and organs. Both GIP and GLP-1 play roles in regulating food intake by stimulating neurons
      in the brain's satiety center. They also stimulate insulin secretion in pancreatic β-cells, but
      their effects on glucagon production in pancreatic α-cells differ, with GIP having a glucagonotropic
      effect during hypoglycemia and GLP-1 exhibiting glucagonostatic effect during hyperglycemia. Additionally,
      GIP directly stimulates lipogenesis, while GLP-1 indirectly promotes lipolysis, collectively maintaining
      healthy adipocytes, reducing ectopic fat distribution, and increasing the production and secretion
      of adiponectin from adipocytes. Together, these two incretins contribute to metabolic homeostasis,
      preventing both hyperglycemia and hypoglycemia, mitigating dyslipidemia, and reducing the risk of
      cardiovascular diseases in individuals with type 2 diabetes and obesity. Several GLP-1 and dual
      GIP/GLP-1 receptor agonists have been developed to harness these pharmacological effects in the
      treatment of type 2 diabetes, with some demonstrating robust effectiveness in weight management
      and prevention of cardiovascular diseases. Elucidating the underlying cellular and molecular mechanisms
      could potentially usher in the development of new generations of incretin mimetics with enhanced
      efficacy and fewer adverse effects. The treatment guidelines are evolving based on clinical trial
      outcomes, shaping the management of metabolic and cardiovascular diseases.
